# Runs when a release is published. The tag picks the package:
#   big-clock-v1.2.0  ->  packages/big-clock, which must be at version 1.2.0
# Builds that one package and attaches its zip to the release.
name: Package release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Build package
        run: python3 tools/build.py --tag "$TAG"
        env:
          TAG: ${{ github.event.release.tag_name }}

      - name: Attach zip to release
        run: gh release upload "$TAG" dist/*.zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
